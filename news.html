<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live News | UCanWorkFromHome</title>
<meta name="description" content="Live, automatically refreshed news headlines from around the web, organized by topic.">
<link rel="stylesheet" href="style.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QBRV8N7K2B"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-QBRV8N7K2B');</script>
<style>
.news-page{max-width:1100px;margin:0 auto;padding:42px 18px 90px}.news-hero{text-align:center;margin-bottom:26px}.news-hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:.15em 0}.news-hero p{max-width:760px;margin:0 auto;color:#555;font-size:1.05rem}.news-tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:25px 0}.news-tabs button{border:1px solid #ccc;background:#fff;padding:10px 15px;border-radius:999px;cursor:pointer;font-weight:700}.news-tabs button.active,.news-tabs button:hover{background:#111;color:#fff;border-color:#111}.news-meta{text-align:center;color:#666;min-height:24px;margin-bottom:16px}.news-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.news-card{display:block;border:1px solid #ddd;border-radius:14px;padding:18px;text-decoration:none;color:inherit;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.04)}.news-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.08)}.news-card h2{font-size:1.08rem;line-height:1.35;margin:0 0 10px}.news-card .source{font-size:.88rem;color:#666}.news-card .when{font-size:.82rem;color:#888;margin-left:8px}.news-error{grid-column:1/-1;padding:30px;text-align:center;border:1px dashed #aaa;border-radius:14px}.news-back{text-align:center;margin:28px 0}.news-back a{font-weight:700}@media(max-width:720px){.news-grid{grid-template-columns:1fr}.news-page{padding-top:25px}}
</style>
</head>
<body>
<main class="news-page">
<section class="news-hero"><div style="font-size:.9rem;font-weight:800;letter-spacing:.12em;color:#c81920">LIVE • AUTO-REFRESHING</div><h1>What's Happening Now</h1><p>Fresh headlines pulled when you open the page. Choose a topic below; stories open on the original publisher's website.</p></section>
<div class="news-tabs" id="newsTabs">
<button class="active">Latest</button>
<button>Business</button>
<button>Technology</button>
<button>Health</button>
<button>Sports</button>
<button>Entertainment</button>
</div>
<div class="news-meta" id="newsMeta">Loading current headlines…</div>
<section class="news-grid" id="newsGrid" aria-live="polite"></section>
<div class="news-back"><a href="index.html">← Back to UCanWorkFromHome</a></div>
</main>
<script src="news-data.js"></script>
<script>
const grid=document.getElementById('newsGrid'),meta=document.getElementById('newsMeta');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(category){
  const data=window.UCAN_NEWS_DATA||{}, cats=data.categories||{}, items=(cats[category]||cats.Latest||[]).slice(0,30);
  if(!items.length){grid.innerHTML='<div class="news-error"><strong>Live headlines are not loaded yet.</strong><br>They will populate automatically after the site is published.</div>';meta.textContent='';return;}
  grid.innerHTML=items.map(x=>`<a class="news-card" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><h2>${esc(x.title)}</h2><span class="source">${esc(x.source||'news source')}</span></a>`).join('');
  let stamp=''; if(data.updated){const d=new Date(data.updated); if(!isNaN(d)) stamp=' • updated '+d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
  meta.textContent=items.length+' current '+category.toLowerCase()+' headlines'+stamp;
}
document.getElementById('newsTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#newsTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.textContent.trim())});
show('Latest');
</script>
<script src="news-ticker.js" defer></script>
</body>
</html>
