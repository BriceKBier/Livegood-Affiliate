<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How Smart Are You? Free 25-Question Brain Challenge | UCanWorkFromHome</title><meta name="description" content="How smart are you? Take this free 25-question IQ-style reasoning challenge with logic, patterns, numbers, words and deduction. No signup required."><link rel="canonical" href="https://ucanworkfromhome.com/how-smart-are-you.html"><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#152238}.wrap{max-width:850px;margin:auto;padding:24px}.hero{text-align:center;padding:38px 18px;background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;border-radius:0 0 28px 28px}.hero h1{font-size:clamp(34px,7vw,58px);margin:5px}.hero p{font-size:19px}.card{background:#fff;border-radius:18px;padding:24px;margin:22px 0;box-shadow:0 5px 22px #0002}.q{font-size:21px;font-weight:700;margin-bottom:16px}.answers button{display:block;width:100%;text-align:left;margin:9px 0;padding:13px 15px;border:1px solid #ccd6e5;border-radius:10px;background:#fff;font-size:17px;cursor:pointer}.answers button:hover{background:#edf5ff}.answers button.sel{background:#dcecff;border:2px solid #1976d2}.nav{display:flex;justify-content:space-between;gap:10px}.btn{border:0;border-radius:10px;background:#1769aa;color:#fff;padding:13px 20px;font-weight:700;cursor:pointer}.muted{color:#64748b}.progress{height:10px;background:#dce3ec;border-radius:8px;overflow:hidden}.bar{height:100%;background:#1976d2;width:4%}.result{text-align:center}.score{font-size:54px;font-weight:800;color:#0d47a1}.share{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.share button,.share a{padding:11px 14px;border-radius:9px;border:0;background:#1769aa;color:white;text-decoration:none;font-weight:700;cursor:pointer}.note{font-size:13px;color:#64748b;text-align:center}.home{color:white;text-decoration:none}</style></head><body><div class="hero"><a class="home" href="fun.html">← Brain Playground</a><h1>🧠 How Smart Are You?</h1><p>Take the Free 25-Question Challenge</p><div>No signup • Instant score • Just for fun</div></div><main class="wrap"><div class="card" id="quiz"><div class="progress"><div class="bar" id="bar"></div></div><p class="muted" id="count"></p><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="nav"><button class="btn" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div></div><div class="card result" id="result" hidden><h2>Your Score</h2><div class="score" id="score"></div><h2 id="rating"></h2><p id="resultText"></p><div class="share"><button onclick="nativeShare()">📱 Share</button><a id="fb" target="_blank">Facebook</a><a id="email">✉️ Email</a><button onclick="copyLink()">Copy Link</button><button onclick="restart()">Try Again</button></div><p class="note" id="shareNote"></p></div><p class="note">This is a recreational IQ-style reasoning challenge, not a standardized or clinical intelligence assessment.</p></main><script>
const Q=[
['What number comes next? 2, 4, 8, 16, ?', ['24','30','32','34'],2],['Which word does not belong?',['Apple','Banana','Carrot','Orange'],2],['If all Bloops are Razzies and all Razzies are Lazzies, are all Bloops Lazzies?',['Yes','No','Not enough information','Only sometimes'],0],['What number comes next? 1, 4, 9, 16, ?',['20','25','27','32'],1],['Book is to Reading as Fork is to…',['Drawing','Writing','Eating','Cutting'],2],['Which is the odd one out?',['Triangle','Square','Circle','Rectangle'],2],['A clock shows 3:00. What angle is between the hands?',['45°','60°','90°','120°'],2],['What comes next? A, C, F, J, ?',['M','N','O','P'],2],['If 5 machines make 5 widgets in 5 minutes, how long do 100 machines take to make 100 widgets?',['5 minutes','20 minutes','100 minutes','500 minutes'],0],['Which number is missing? 3, 6, 12, 24, ?',['30','36','42','48'],3],['Bird is to Nest as Bee is to…',['Web','Hive','Den','Burrow'],1],['Which pair has the same relationship as 3:9?',['2:4','4:12','5:25','6:18'],2],['If yesterday was two days before Friday, what day is today?',['Wednesday','Thursday','Friday','Saturday'],1],['What number comes next? 100, 90, 72, 48, ?',['18','20','24','30'],0],['Unscramble: LISTEN. Which word uses exactly the same letters?',['Silent','Enlistment','Little','Tinselbox'],0],['A farmer has 17 sheep. All but 9 run away. How many remain?',['8','9','17','26'],1],['Which number does not fit? 2, 3, 5, 7, 9, 11',['3','7','9','11'],2],['If CAT = 24 using letter values A=1, B=2…, what is DOG?',['24','26','28','30'],1],['What comes next? Z, X, U, Q, ?',['M','L','K','J'],1],['Three people each shake hands with every other person once. How many handshakes?',['2','3','4','6'],1],['Which is largest?',['3/4','0.70','68%','2/3'],0],['A bat and ball cost $1.10 total. The bat costs $1 more than the ball. Ball cost?',['5¢','10¢','15¢','20¢'],0],['What number comes next? 1, 1, 2, 3, 5, 8, ?',['11','12','13','14'],2],['If SOME Smarts are Quick and ALL Quick things are Bright, which must be true?',['All Smarts are Bright','Some Smarts are Bright','No Smarts are Bright','All Bright things are Smarts'],1],['Which word completes both: HEAD___ and ___HOUSE?',['light','room','board','green'],0]
];let i=0,a=Array(Q.length).fill(null);const q=document.getElementById('question'),ans=document.getElementById('answers');function render(){document.getElementById('count').textContent=`Question ${i+1} of ${Q.length}`;document.getElementById('bar').style.width=((i+1)/Q.length*100)+'%';q.textContent=Q[i][0];ans.innerHTML='';Q[i][1].forEach((x,j)=>{let b=document.createElement('button');b.textContent=x;if(a[i]===j)b.className='sel';b.onclick=()=>{a[i]=j;render()};ans.appendChild(b)});document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===Q.length-1?'See My Score →':'Next →'}document.getElementById('prev').onclick=()=>{if(i){i--;render()}};document.getElementById('next').onclick=()=>{if(a[i]===null){alert('Choose an answer first.');return}if(i<Q.length-1){i++;render()}else finish()};function finish(){let s=a.reduce((n,x,j)=>n+(x===Q[j][2]),0);document.getElementById('quiz').hidden=true;document.getElementById('result').hidden=false;document.getElementById('score').textContent=`${s}/25`;let r=s>=22?'Exceptional!':s>=18?'Excellent!':s>=14?'Strong showing!':s>=10?'Nice work!':'Keep challenging your brain!';document.getElementById('rating').textContent=r;document.getElementById('resultText').textContent='Challenge a friend and see who scores higher.';setupShare(s);window.scrollTo({top:0,behavior:'smooth'})}function shareUrl(src='share'){return `https://ucanworkfromhome.com/how-smart-are-you.html?utm_source=${src}&utm_medium=referral&utm_campaign=how_smart_are_you`}function setupShare(s){let txt=`I scored ${s}/25 on “How Smart Are You?” Can you beat me?`;document.getElementById('fb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(shareUrl('facebook'));document.getElementById('email').href='mailto:?subject='+encodeURIComponent('How Smart Are You? Can you beat my score?')+'&body='+encodeURIComponent(txt+'\n\n'+shareUrl('email'));window.shareTxt=txt}async function nativeShare(){let u=shareUrl('native_share');if(navigator.share)await navigator.share({title:'How Smart Are You?',text:window.shareTxt,url:u});else{await navigator.clipboard.writeText(window.shareTxt+' '+u);document.getElementById('shareNote').textContent='Share message copied.'}}async function copyLink(){await navigator.clipboard.writeText(shareUrl('copy_link'));document.getElementById('shareNote').textContent='✓ Link copied.'}function restart(){i=0;a.fill(null);document.getElementById('result').hidden=true;document.getElementById('quiz').hidden=false;render()}render();</script></body></html>
